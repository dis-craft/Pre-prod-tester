<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-prod Tester — Live Flow</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3}
main{max-width:1000px;margin:auto;padding:28px 18px 70px}
h1{margin:0 0 4px;font-size:30px}.muted{color:#8b949e}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
a{color:#58a6ff;text-decoration:none}a:hover{text-decoration:underline}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:18px;margin-top:16px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.metric{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px}.metric span{display:block;color:#8b949e;font-size:12px}.metric strong{display:block;margin-top:5px;font-size:15px;word-break:break-word}
.flow{margin-top:22px}
.stage{position:relative;display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px}
.stage:not(:last-child)::after{content:"↓";position:absolute;left:17px;top:54px;color:#6e7681;font-size:28px;z-index:0}
.dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #30363d;background:#0d1117;z-index:1;font-weight:700}
.body{border:1px solid #30363d;border-radius:10px;background:#11161d;padding:14px;margin-bottom:22px}
.title{display:flex;justify-content:space-between;gap:12px;align-items:center}.title h3{margin:0;font-size:17px}
.status{font-size:11px;border-radius:999px;border:1px solid #30363d;padding:4px 8px;text-transform:uppercase;letter-spacing:.04em}
.status.pass{border-color:#238636;color:#3fb950}.status.running{border-color:#9e6a03;color:#d29922}.status.fail{border-color:#da3633;color:#f85149}.status.error{border-color:#8957e5;color:#bc8cff}.status.waiting{border-color:#1f6feb;color:#58a6ff}.status.pending{color:#8b949e}
.detail{margin-top:8px;color:#c9d1d9;font-size:13px;line-height:1.5}.small{font-size:12px;color:#8b949e;margin-top:8px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.nav{display:flex;gap:10px;flex-wrap:wrap}.button{display:inline-block;border:1px solid #30363d;border-radius:7px;padding:8px 11px;background:#21262d}
.pill{display:inline-block;margin-left:6px;border:1px solid #30363d;border-radius:999px;padding:2px 7px;font-size:11px;color:#8b949e}
@media(max-width:650px){main{padding:20px 10px}.stage{grid-template-columns:42px minmax(0,1fr)}.stage:not(:last-child)::after{left:11px}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Live Security Flow</h1>
      <div class="muted">Commit → scan → AI fix → validate → PR → re-scan → review → merge</div>
    </div>
    <div class="nav"><a class="button" href="./">Dashboard</a><a class="button" href="#" id="refresh">Refresh</a></div>
  </div>
  <div id="summary" class="card">Loading live flow…</div>
  <div id="flow" class="flow"></div>
</main>
<script>
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const statusClass=s=>['pass','running','fail','error','waiting','pending'].includes(s)?s:'pending';
const icon=s=>({pass:'✓',running:'•',fail:'!',error:'×',waiting:'…',pending:'○'})[statusClass(s)]||'○';

function render(d){
  const c=d.commit||{}, p=d.pull_request||{};
  document.getElementById('summary').innerHTML =
    '<strong>Current commit</strong> <code>'+esc(c.sha||'unknown')+'</code>'+
    '<div class="meta">'+
    '<div class="metric"><span>Author</span><strong>'+esc(c.author||'unknown')+'</strong></div>'+
    '<div class="metric"><span>Branch</span><strong>'+esc(c.branch||'unknown')+'</strong></div>'+
    '<div class="metric"><span>Message</span><strong>'+esc(c.message||'unknown')+'</strong></div>'+
    '<div class="metric"><span>Current</span><strong>'+esc(d.current_stage_label||'Unknown')+'</strong></div>'+
    '</div>'+
    (p.url?'<div class="small">PR <a href="'+esc(p.url)+'" target="_blank">#'+esc(p.number)+' ↗</a> · '+esc(p.state||'')+' · '+esc(p.head||'')+'</div>':'')+
    '<div class="small">Last flow update: '+esc(d.generated_at||'unknown')+' · auto-refresh every 8 seconds</div>';

  const stages=d.stages||[];
  document.getElementById('flow').innerHTML=stages.map((s,i)=>
    '<div class="stage">'+
      '<div class="dot">'+icon(s.status)+'</div>'+
      '<div class="body">'+
        '<div class="title"><h3>'+esc(s.label)+'</h3><span class="status '+statusClass(s.status)+'">'+esc(s.status)+'</span></div>'+
        '<div class="detail">'+esc(s.detail||'')+'</div>'+
        (s.if_case?'<div class="small"><strong>If:</strong> '+esc(s.if_case)+'</div>':'')+
        (s.next?'<div class="small"><strong>Next:</strong> '+esc(s.next)+'</div>':'')+
        (s.run_url?'<div class="small"><a href="'+esc(s.run_url)+'" target="_blank">Open workflow run ↗</a></div>':'')+
        (s.pr_url?'<div class="small"><a href="'+esc(s.pr_url)+'" target="_blank">Open PR ↗</a></div>':'')+
      '</div>'+
    '</div>'
  ).join('');
}
async function api(path){
 const r=await fetch('https://api.github.com/repos/dis-craft/Pre-prod-tester'+path,{headers:{'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'});
 if(!r.ok) throw new Error('GitHub API '+r.status+' for '+path);
 return r.json();
}
function liveFlow(commit,runs,prs){
 const run=runs.workflow_runs?.find(x=>x.head_sha===commit.sha) || runs.workflow_runs?.[0];
 const pr=prs.find(x=>x.head.sha===commit.sha) || prs.find(x=>x.head.ref.startsWith('security/ai-remediation/'));
 let scan='waiting', rem='waiting', prscan='waiting', review='waiting', merge='waiting', detail='Waiting for the corresponding workflow.';
 if(run){
   if(run.name==='Capture Changes and Publish'){
     scan=run.status==='completed'?(run.conclusion==='success'?'pass':'fail'):'running';
     detail=run.status==='completed'?'Initial capture/security workflow '+run.conclusion+'.':'Initial capture/security workflow is running.';
   }
   if(run.name==='AI Security Remediation'){
     scan='pass'; rem=run.status==='completed'?(run.conclusion==='success'?'pass':'fail'):'running';
     detail='AI remediation workflow '+run.status+(run.conclusion?(' / '+run.conclusion):'')+'.';
   }
 }
 if(pr){
   prscan=pr.state==='open'?'running':(pr.merged?'pass':'fail');
   review=pr.merged?'pass':(pr.state==='open'?'waiting':'fail');
   merge=pr.merged?'pass':(pr.state==='open'?'waiting':'fail');
 }
 return {run,pr,scan,rem,prscan,review,merge,detail};
}
async function load(){
 try{
  const d=await fetch('data/latest.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
  const c=d.commit||{};
  const runs=await api('/actions/runs?per_page=30&event=push');
  const prs=await api('/pulls?state=all&per_page=30&sort=updated&direction=desc');
  const live=liveFlow(c,runs,prs);
  const labels=[
   ['Commit received','pass','Push received from '+(c.author||'unknown')+'.'],
   ['Capture exact diff','pass','Commit '+(c.sha||'').slice(0,12)+' captured.'],
   ['Security scan',live.scan,live.detail],
   ['AI remediation',live.rem,'Primary model retries, then fallback model when configured.'],
   ['Sandbox validation',live.rem==='pass'?'pass':live.rem==='fail'?'fail':'waiting','AI changes are validated before acceptance.'],
   ['Post-fix scan',live.rem==='pass'?'pass':live.rem==='fail'?'fail':'waiting','The remediation state is re-scanned before PR creation.'],
   ['Remediation PR',live.pr?'pass':'waiting',live.pr?'PR #'+live.pr.number+' exists.':'Waiting for a remediation PR.'],
   ['Full PR security re-scan',live.prscan,live.pr?'PR '+live.pr.state+'.':'Waiting for PR.'],
   ['Human review',live.review,live.pr?(live.pr.merged?'PR merged after review.':'Waiting for human review/approval.'):'Waiting for PR.'],
   ['Merge / completed',live.merge,live.pr?(live.pr.merged?'Merged.':'Not merged.'):'Waiting.']
  ];
  d.stages=labels.map((x,i)=>({label:(i+1)+'. '+x[0],status:x[1],detail:x[2],run_url:live.run?.html_url,pr_url:live.pr?.html_url}));
  d.current_stage_label=labels.find(x=>x[1]==='running')?.[0] || labels.find(x=>x[1]==='fail')?.[0] || (live.pr?'Human review':'Security scan');
  d.pull_request=live.pr?{number:live.pr.number,url:live.pr.html_url,state:live.pr.state,head:live.pr.head.ref,base:live.pr.base.ref}:null;
  render(d);
 }catch(e){
  document.getElementById('summary').innerHTML='<strong>Live flow data unavailable.</strong><div class="small">'+esc(e.message)+'</div><div class="small">The static flow snapshot remains available in data/flow.json.</div>';
 }
}
document.getElementById('refresh').addEventListener('click',e=>{e.preventDefault();load()});
load(); setInterval(load,8000);
</script>
</body>
</html>
