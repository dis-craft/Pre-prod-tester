name: AI Security Remediation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '.pages/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediation:
    uses: dis-craft/Pre-Prod-Orchestrator/.github/workflows/preprod-security.yml@main
    with:
      generate-remediation: true
      test-command: ""
      fallback-model: gemini-2.5-flash
      primary-attempts: "3"
      fallback-attempts: "2"
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
