name: AI Security Remediation

on:
  workflow_run:
    workflows:
      - Capture Changes and Publish
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: ai-remediation-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  remediation:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: dis-craft/Pre-Prod-Orchestrator/.github/workflows/preprod-security.yml@main
    with:
      generate-remediation: true
      test-command: ""
      fallback-model: gemini-2.5-flash
      primary-attempts: "1"
      fallback-attempts: "1"
      full-repo-rescan: false
      scan-input: data/scans/${{ github.event.workflow_run.head_sha }}.json
      source-sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
