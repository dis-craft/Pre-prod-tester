name: Capture Changes and Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture exact push diff
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/capture-diff.py

      - name: Run live security detection
        id: security
        uses: dis-craft/Pre-Prod-Orchestrator/.github/actions/security-engine@main
        with:
          scan-input: data/latest.json
          scan-output: .preprod/baseline-scan
          generate-remediation: "false"

      - name: Attach findings to published scan
        env:
          FINDINGS: ${{ steps.security.outputs.findings }}
        run: |
          set -euo pipefail
          test -n "$FINDINGS"
          python3 scripts/attach-security-findings.py --scan data/latest.json --findings "$FINDINGS"
      - name: Attach live remediation PR state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls?state=all&per_page=30&sort=updated&direction=desc",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              prs = json.load(response)

          remediation_prs = []
          for pr in prs:
              head = pr.get("head", {}).get("ref", "")
              if not (head.startswith("security-remediation/") or head.startswith("security/ai-remediation/")):
                  continue
              remediation_prs.append({
                  "number": pr.get("number"),
                  "title": pr.get("title"),
                  "state": pr.get("state"),
                  "merged": pr.get("merged_at") is not None,
                  "head": head,
                  "base": pr.get("base", {}).get("ref"),
                  "url": pr.get("html_url"),
                  "created_at": pr.get("created_at"),
                  "updated_at": pr.get("updated_at"),
                  "merged_at": pr.get("merged_at"),
              })

          path = Path("data/latest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["pull_requests"] = remediation_prs
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(remediation_prs, indent=2))
          PY

      - name: Persist generated scan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/index.json data/scans/ data/flow.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: publish scan data [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:"$GITHUB_REF_NAME"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Unable to publish scan data after 3 push attempts. Another workflow changed main concurrently."
                exit 1
              fi
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
            done
          fi

      - name: Build isolated Pages site
        run: |
          rm -rf .pages
          mkdir -p .pages/data/scans
          cp index.html .pages/index.html
          cp flow.html .pages/flow.html
          cp data/latest.json .pages/data/latest.json
          cp data/index.json .pages/data/index.json
          cp -R data/scans/. .pages/data/scans/

          cat > .pages/deployment.json <<EOF
          {
            "deployed_commit": "${{ github.sha }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run": "${{ github.run_id }}"
          }
          EOF

          echo "Pages payload:"
          find .pages -type f -maxdepth 4 -print
          echo "Latest scan:"
          python3 -m json.tool .pages/data/latest.json | head -80

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
