name: Capture Changes and Publish

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: scan-data-publish
  cancel-in-progress: false

jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture exact push diff
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/capture-diff.py

      - name: Run live security detection
        id: security
        uses: dis-craft/Pre-Prod-Orchestrator/.github/actions/security-engine@main
        with:
          scan-input: data/latest.json
          scan-output: .preprod/baseline-scan
          generate-remediation: "false"

      - name: Attach findings to published scan
        env:
          FINDINGS: ${{ steps.security.outputs.findings }}
        run: |
          set -euo pipefail
          test -n "$FINDINGS"
          python3 scripts/attach-security-findings.py --scan data/latest.json --findings "$FINDINGS"

      - name: Build live flow state before remediation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python3 scripts/build-dashboard-flow.py

      - name: Snapshot generated scan data
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/generated-scan-data"
          mkdir -p "$RUNNER_TEMP/generated-scan-data"
          cp -a data/. "$RUNNER_TEMP/generated-scan-data/"

      - name: Publish generated scan data atomically
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          published=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .preprod -e .pages

            rm -rf data
            mkdir -p data
            cp -a "$RUNNER_TEMP/generated-scan-data/." data/

            git add data/latest.json data/index.json data/scans/
            if git diff --cached --quiet; then
              echo "No generated scan-data changes to publish."
              published=1
              break
            fi

            git commit -m "chore: publish scan data [skip ci]"

            if git push origin HEAD:main; then
              published=1
              break
            fi

            echo "Publish attempt $attempt lost a race with another main update; rebuilding on latest origin/main."
          done

          if [ "$published" -ne 1 ]; then
            echo "::error::Could not publish scan data after 3 atomic retries."
            exit 1
          fi

      - name: Remove legacy test branches
        if: contains(github.event.head_commit.message, 'fresh canonical security pipeline')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git fetch origin --prune
          for branch in security-e2e-test security-pipeline-test feature/full-security-pipeline; do
            git push origin --delete "$branch"
          done
          git ls-remote --heads origin 'refs/heads/security-remediation/*' |
            awk '{sub("refs/heads/","",$2); print $2}' |
            while read -r branch; do
              [ -z "$branch" ] || git push origin --delete "$branch"
            done
          true

  remediation:
    needs: capture-and-publish
    uses: dis-craft/Pre-Prod-Orchestrator/.github/workflows/preprod-security.yml@main
    with:
      generate-remediation: true
      test-command: ""
      fallback-model: gemini-2.5-flash
      primary-attempts: "1"
      fallback-attempts: "1"
      full-repo-rescan: false
      scan-input: data/scans/${{ github.sha }}.json
      source-sha: ${{ github.sha }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
