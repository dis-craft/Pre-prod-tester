name: Live Remediation Smoke Test

on:
  push:
    branches: [security-pipeline-test]

permissions:
  contents: write
  pull-requests: write

jobs:
  security:
    uses: dis-craft/Pre-Prod-Orchestrator/.github/workflows/preprod-security.yml@Adi-initial
    with:
      generate-remediation: true
      test-command: ""
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}