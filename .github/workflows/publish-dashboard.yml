name: Publish Dashboard

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_run:
    workflows:
      - Capture Changes and Publish
      - AI Security Remediation
      - Security Review
    types: [requested, in_progress, completed]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build runtime flow state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python3 scripts/build-dashboard-flow.py

      - name: Build Pages payload
        run: |
          set -euo pipefail
          rm -rf .pages
          mkdir -p .pages/data/scans
          cp index.html .pages/index.html
          cp flow.html .pages/flow.html
          cp data/latest.json .pages/data/latest.json
          cp data/index.json .pages/data/index.json
          cp -R data/scans/. .pages/data/scans/

          if [ -f .runtime-flow.json ]; then
            cp .runtime-flow.json .pages/data/flow.json
          else
            printf '{"schema_version":"1.1","current_stage_label":"Waiting","stages":[]}
' > .pages/data/flow.json
          fi

          if [ -f .runtime-prs.json ]; then
            cp .runtime-prs.json .pages/data/pull-requests.json
          else
            printf '[]
' > .pages/data/pull-requests.json
          fi

          cat > .pages/deployment.json <<EOF
          {
            "deployed_commit": "${{ github.sha }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run": "${{ github.run_id }}"
          }
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
