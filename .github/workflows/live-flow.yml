name: Publish Live Flow State

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_run:
    workflows:
      - Capture Changes and Publish
      - AI Security Remediation
      - Security Review
      - Publish Live Remediation PR State
    types: [requested, in_progress, completed]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: live-flow
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build live flow state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          sha=os.environ["EVENT_SHA"]

          def get(path):
              req=urllib.request.Request(
                  "https://api.github.com/repos/"+repo+path,
                  headers={
                    "Accept":"application/vnd.github+json",
                    "Authorization":"Bearer "+token,
                    "X-GitHub-Api-Version":"2022-11-28",
                  })
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          commit=get("/commits/"+sha)
          runs=get("/actions/runs?per_page=50")
          prs=get("/pulls?state=all&per_page=50&sort=updated&direction=desc").copy()

          def latest_run(name):
              xs=[x for x in runs.get("workflow_runs",[]) if x.get("name")==name and x.get("head_sha")==sha]
              return xs[0] if xs else None

          capture=latest_run("Capture Changes and Publish")
          ai=latest_run("AI Security Remediation")
          review=latest_run("Security Review")
          pr=next((x for x in prs if x.get("head",{}).get("sha")==sha or x.get("head",{}).get("ref","").startswith("security/ai-remediation/")),None)

          def state(run):
              if not run: return "waiting"
              if run.get("status")=="completed":
                  return "pass" if run.get("conclusion")=="success" else ("error" if run.get("conclusion") in {"cancelled","timed_out","action_required"} else "fail")
              if run.get("status") in {"queued","in_progress","waiting","requested"}: return "running"
              return "pending"

          capture_state=state(capture)
          ai_state=state(ai)
          review_state=state(review)

          # Capture contains the initial scanner. If it completed cleanly, that stage is done.
          security_detail="Waiting for the capture/security workflow."
          if capture:
              security_detail="Initial capture/security workflow: "+capture.get("status","unknown")
              if capture.get("conclusion"): security_detail += " / "+capture["conclusion"]+"."

          pr_state="waiting"
          if pr:
              if pr.get("merged_at"):
                  pr_state="pass"
              elif pr.get("state")=="open":
                  pr_state="running"
              else:
                  pr_state="fail"

          review_display=review_state if review else ("waiting" if pr else "waiting")
          merge_display="pass" if pr and pr.get("merged_at") else ("waiting" if pr and pr.get("state")=="open" else ("fail" if pr else "waiting"))

          stages=[
            ("1. Commit received","pass","Commit received from "+(commit.get("author",{}).get("login") or commit.get("commit",{}).get("author",{}).get("name","unknown"))+"."),
            ("2. Capture exact diff",capture_state,"Capture and publication workflow is "+(capture.get("status","waiting") if capture else "waiting")+"."),
            ("3. Security scan",capture_state,security_detail),
            ("4. AI remediation",ai_state,"Gemini primary model retries first; secondary Gemini model is used only after primary attempts are exhausted."),
            ("5. Sandbox validation","pass" if ai_state=="pass" else ("fail" if ai_state=="fail" else "waiting"),"AI changes are sandbox-validated before acceptance."),
            ("6. Post-fix scan","pass" if ai_state=="pass" else ("fail" if ai_state=="fail" else "waiting"),"The remediation is re-scanned before a PR is created."),
            ("7. Remediation PR","pass" if pr else "waiting","PR #"+str(pr["number"])+" exists." if pr else "Waiting for validated remediation."),
            ("8. Full PR security re-scan",review_state if pr else "waiting","Full repository PR security review is "+(review.get("status","waiting") if review else "waiting")+"."),
            ("9. Human review","pass" if pr and pr.get("merged_at") else ("running" if pr and pr.get("state")=="open" and not review else review_display),"Human approval is required before merge."),
            ("10. Merge / completed",merge_display,"Merged." if merge_display=="pass" else ("Waiting for merge." if merge_display=="waiting" else "PR closed without merge."))
          ]

          running=next((x for x in stages if x[1]=="running"),None)
          failed=next((x for x in stages if x[1] in {"fail","error"}),None)
          current=running[0] if running else (failed[0] if failed else ("9. Human review" if pr and pr.get("state")=="open" else "3. Security scan"))

          flow={
            "schema_version":"1.1",
            "generated_at":datetime.now(timezone.utc).isoformat(),
            "current_stage_label":current,
            "commit":{
              "sha":sha,
              "author":commit.get("author",{}).get("login") or commit.get("commit",{}).get("author",{}).get("name","unknown"),
              "branch":commit.get("html_url","").split("/commit/")[0].split("/")[-1] if False else "main",
              "message":commit.get("commit",{}).get("message","").splitlines()[0],
              "url":commit.get("html_url",""),
            },
            "pull_request":None if not pr else {
              "number":pr["number"],"url":pr["html_url"],"state":pr["state"],
              "head":pr["head"]["ref"],"base":pr["base"]["ref"],
              "merged":bool(pr.get("merged_at"))
            },
            "stages":[
              {"label":label,"status":status,"detail":detail,
               "run_url":(capture or ai or review or {}).get("html_url"),
               "pr_url":pr.get("html_url") if pr else None}
              for label,status,detail in stages
            ]
          }
          Path("data/flow.json").write_text(json.dumps(flow,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(flow,indent=2))
          PY

      - name: Publish flow state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flow.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish live flow state [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Unable to publish live flow state after 3 attempts."
          exit 1
